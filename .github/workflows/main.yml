name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Vanta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Vanta project
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Vanta ZIP found in repository root."
            exit 1
          fi

          rm -rf .vanta-extracted
          mkdir .vanta-extracted

          unzip -q "$ZIP_FILE" -d .vanta-extracted

          PROJECT_DIR="$(find .vanta-extracted -mindepth 1 -maxdepth 1 -type d -print -quit)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: ZIP does not contain a project directory."
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

          rm -rf .vanta-extracted
          rm -f "$ZIP_FILE"

          echo "Project structure:"
          find . -maxdepth 2 -type d | sort

          if [ ! -d "app" ]; then
            echo "ERROR: app directory still does not exist."
            exit 1
          fi

          if [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts is missing."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Vanta APK
        run: |
          set -e
          gradle --no-daemon assembleDebug

      - name: Find APK
        run: |
          find app/build/outputs -type f -name '*.apk' -print

      - name: Upload Vanta APK
        uses: actions/upload-artifact@v4
        with:
          name: Vanta-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
